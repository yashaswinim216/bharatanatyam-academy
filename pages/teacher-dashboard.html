
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | Kala Bharati</title>
    <link rel="stylesheet" href="pages.css">
    <style>
        .dashboard { max-width: 1000px; margin: 35px auto; padding: 20px; }
        h1, h3 { color: var(--maroon); }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            padding: 24px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
        }
        .logout {
            padding: 10px 16px;
            background: var(--maroon);
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <a href="../index.html" style="color:inherit;text-decoration:none">Kala Bharati</a>
        </div>
        <nav>
            <a href="../index.html">Home</a>
            <button class="logout" id="logoutButton">Log Out</button>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Teacher Dashboard</h1>
        <p id="welcome">Verifying your access...</p>
        <p id="status" role="status" aria-live="polite"></p>

       
<section class="cards">
    <article class="card">
        <h3>My Classes</h3>
        <div id="teacherClasses">
            Loading your assigned classes...
        </div>
    </article>

    <article class="card">
        <h3>My Students</h3>
        <div id="teacherStudents">
            Loading your students...
        </div>
    </article>

    <article class="card">
        <h3>Academy Events</h3>
        <p>View upcoming academy events and workshops.</p>
        <a href="events.html">View Events</a>
    </article>
</section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://tvfwvsntplommjwvedpb.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__XZhyFocE3eDXgVhxg0bhA_1WxHP5Bf";

        const client = window.supabase.createClient(
            SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
        );

        async function protectDashboard() {
            try {
                const { data, error } = await client.auth.getUser();

                if (error || !data.user) {
                    window.location.replace("teacher-login.html");
                    return;
                }

                const { data: profile, error: profileError } = await client
                    .from("profiles")
                    .select("full_name, role")
                    .eq("id", data.user.id)
                    .single();

                if (profileError || !profile || profile.role !== "teacher") {
                    await client.auth.signOut();
                    window.location.replace("teacher-login.html");
                    return;
                }

                document.getElementById("welcome").textContent =
                    "Welcome, " + (profile.full_name || "Teacher") + "!";
                document.getElementById("status").textContent =
                    "Teacher access verified.";
                    document.getElementById("welcome").textContent =
    "Welcome, " + (profile.full_name || "Teacher") + "!";
    await loadTeacherClasses(data.user.id);

            } catch (error) {
                document.getElementById("status").textContent =
                    "Unable to verify access. Please try logging in again.";
            }
        }

        document.getElementById("logoutButton").addEventListener("click", async () => {
            await client.auth.signOut();
            window.location.replace("teacher-login.html");
        });
        
async function loadTeacherClasses(teacherId) {
    const classesBox = document.getElementById("teacherClasses");
    const studentsBox = document.getElementById("teacherStudents");

    try {
        const { data: classes, error } = await client
            .from("class_assignments")
            .select("course_level, days, timing, instructor_title")
            .eq("teacher_id", teacherId);

        if (error) throw error;

        classesBox.replaceChildren();

        if (!classes || classes.length === 0) {
            classesBox.textContent = "No classes assigned to you yet.";
            studentsBox.textContent =
                "Students will appear after classes are assigned.";
            return;
        }

        classes.forEach(item => {
            const card = document.createElement("div");
            card.style.marginBottom = "14px";

            const heading = document.createElement("h4");
            heading.textContent = item.course_level;

            const details = document.createElement("p");
            details.textContent =
                `${item.days} · ${item.timing} · ${item.instructor_title}`;

            card.append(heading, details);
            classesBox.appendChild(card);
        });

        const levels = classes.map(item => item.course_level);

        const { data: students, error: studentError } = await client
            .from("profiles")
            .select("full_name, username, course_level")
            .eq("role", "student")
            .in("course_level", levels);

        if (studentError) throw studentError;

        studentsBox.replaceChildren();

        if (!students || students.length === 0) {
            studentsBox.textContent =
                "No students found in your assigned classes.";
            return;
        }

        students.forEach(student => {
            const entry = document.createElement("p");
            entry.textContent =
                `${student.full_name || "Student"} — ${student.course_level}`;
            studentsBox.appendChild(entry);
        });

    } catch (error) {
        console.error("Teacher dashboard error:", error);
        classesBox.textContent =
            "Unable to load classes. Check Supabase permissions.";
        studentsBox.textContent =
            "Unable to load students. Check Supabase permissions.";
    }
}


        protectDashboard();
    </script>
</body>
</html>
