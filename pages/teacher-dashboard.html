
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | Kala Bharati</title>
    <link rel="stylesheet" href="pages.css">
    <style>
        .dashboard { max-width: 1000px; margin: 35px auto; padding: 20px; }
        h1, h3 { color: var(--maroon); }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            padding: 24px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 14px;
        }
        .logout {
            padding: 10px 16px;
            background: var(--maroon);
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <a href="../index.html" style="color:inherit;text-decoration:none">Kala Bharati</a>
        </div>
        <nav>
            <a href="../index.html">Home</a>
            <button class="logout" id="logoutButton">Log Out</button>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Teacher Dashboard</h1>
        <p id="welcome">Verifying your access...</p>
        <p id="status" role="status" aria-live="polite"></p>

        <section class="cards">
            <article class="card">
                <h3>My Classes</h3>
                <p>View your Bharatanatyam class information.</p>
            </article>
            <article class="card">
                <h3>Students</h3>
                <p>Student information will be available here once connected.</p>
            </article>
            <article class="card">
                <h3>Academy Events</h3>
                <p>View upcoming academy events and workshops.</p>
                <a href="events.html">View Events</a>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://tvfwvsntplommjwvedpb.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__XZhyFocE3eDXgVhxg0bhA_1WxHP5Bf";

        const client = window.supabase.createClient(
            SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
        );

        async function protectDashboard() {
            try {
                const { data, error } = await client.auth.getUser();

                if (error || !data.user) {
                    window.location.replace("teacher-login.html");
                    return;
                }

                const { data: profile, error: profileError } = await client
                    .from("profiles")
                    .select("full_name, role")
                    .eq("id", data.user.id)
                    .single();

                if (profileError || !profile || profile.role !== "teacher") {
                    await client.auth.signOut();
                    window.location.replace("teacher-login.html");
                    return;
                }

                document.getElementById("welcome").textContent =
                    "Welcome, " + (profile.full_name || "Teacher") + "!";
                document.getElementById("status").textContent =
                    "Teacher access verified.";

            } catch (error) {
                document.getElementById("status").textContent =
                    "Unable to verify access. Please try logging in again.";
            }
        }

        document.getElementById("logoutButton").addEventListener("click", async () => {
            await client.auth.signOut();
            window.location.replace("teacher-login.html");
        });

        protectDashboard();
    </script>
</body>
</html>
